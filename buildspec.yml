version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: us-east-1
    IMAGE_REPO_NAME: cognito-practice
  # If using Secrets Manager for Docker Hub auth:
  # secrets-manager:
  #   DOCKERHUB_USERNAME: dockerhub-creds:username
  #   DOCKERHUB_PASSWORD: dockerhub-creds:password

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws --version
      # Dynamically fetch the AWS Account ID to fix the "no such host" error
      # - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - echo AWS Account ID $AWS_ACCOUNT_ID
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 264909265522.dkr.ecr.us-east-1.amazonaws.com
      # Uncomment below if pulling FROM Docker Hub and hitting rate limits:
      # - echo $DOCKERHUB_PASSWORD | docker login --username $DOCKERHUB_USERNAME --password-stdin
      - echo Repository URI 264909265522.dkr.ecr.us-east-1.amazonaws.com/

  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      # IMPORTANT: npm install is NOT here. It must be inside your Dockerfile
      # (e.g., RUN npm install && npm run build)
      - |
        docker build \
          --build-arg NEXT_PUBLIC_COGNITO_USER_POOL_ID=$NEXT_PUBLIC_COGNITO_USER_POOL_ID \
          --build-arg NEXT_PUBLIC_COGNITO_CLIENT_ID=$NEXT_PUBLIC_COGNITO_CLIENT_ID \
          --build-arg NEXT_PUBLIC_COGNITO_DOMAIN=$NEXT_PUBLIC_COGNITO_DOMAIN \
          --build-arg NEXT_PUBLIC_REDIRECT_SIGN_IN=$NEXT_PUBLIC_REDIRECT_SIGN_IN \
          --build-arg NEXT_PUBLIC_REDIRECT_SIGN_OUT=$NEXT_PUBLIC_REDIRECT_SIGN_OUT \
          -t $IMAGE_REPO_NAME:$CODEBUILD_RESOLVED_SOURCE_VERSION .
      - echo Tagging the Docker image...
      - docker tag $IMAGE_REPO_NAME:$CODEBUILD_RESOLVED_SOURCE_VERSION 264909265522.dkr.ecr.us-east-1.amazonaws.com/$IMAGE_REPO_NAME:$CODEBUILD_RESOLVED_SOURCE_VERSION

  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker image to ECR...
      - docker push 264909265522.dkr.ecr.us-east-1.amazonaws.com/$IMAGE_REPO_NAME:$CODEBUILD_RESOLVED_SOURCE_VERSION
      - echo Creating imagedefinitions.json...
      - printf '[{"name":"cognito-practice","imageUri":"%s"}]' 264909265522.dkr.ecr.us-east-1.amazonaws.com/$IMAGE_REPO_NAME:$CODEBUILD_RESOLVED_SOURCE_VERSION > imagedefinitions.json
      - echo "Build and push successful!"

artifacts:
  files: imagedefinitions.json